<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="utility.css" />
    <title>'Spotify - Web Player: Music for everyone'</title>
  </head>
  <body>
    <div class="container flex bg-black">
      <div class="left">
       


        <div class="home bg-grey rounded m-1 p-1">

          <div class="close">
            <img class ="invert"  src="close.svg" alt="">
          </div>
          <div class="logo"><img src="logo.svg" alt="logo" /></div>
          
          <ul>
            <li><img src="home.svg" alt="home" />home</li>
            <li><img src="search.svg" alt="search" />search</li>
          </ul>
        </div>

        <div class="library bg-grey m-1 p-1 rounded">
          <div class="heading">
            <img src="playlist.svg" alt="playlistSvg" />
            <h2>Your Library</h2>
          </div>

          <div class="songList">
            <ul>
              <!-- Dynamic song list -->
            </ul>
          </div>

          <div class="footer">
            <div>
              <a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a>
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy/"
                ><span>Privacy Center</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/"
                ><span>Privacy Policy</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/cookies-policy/"
                ><span>Cookies</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"
                ><span>About Ads</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/accessibility/"
                ><span>Accessibility</span></a
              >
            </div>
          </div>
        </div>
      </div>

      <div class="right bg-grey rounded">
        <div class="header rounded">
          <button id="menuBtn">☰</button>
          <div class="nav">
            <svg
              width="24"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                stroke="#ffffff"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg
              width="24"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                stroke="#ffffff"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <div class="buttons">
            <button class="signupbtn">Sign up</button>
            <button class="loginbtn">Log in</button>
          </div>
        </div>

        <div class="spotify-playlists">
          <h2>Spotify Playlists</h2>
          <div class="card-container">
            <div class="card">
              <div class="playbutton">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 30 30"
                  width="60"
                  height="60"
                >
                  <circle cx="12" cy="12" r="12" fill="#1db954" />
                  <g transform="scale(0.74) translate(4  4)">
                    <path
                      d="M18.8906 12.846C18.5371 14.189 16.8667 15.138 13.5257 17.0361C10.296 18.8709 8.6812 19.7884 7.37983 19.4196C6.8418 19.2671 6.35159 18.9776 5.95624 18.5787C5 17.6139 5 15.7426 5 12C5 8.2574 5 6.3861 5.95624 5.42132C6.35159 5.02245 6.8418 4.73288 7.37983 4.58042C8.6812 4.21165 10.296 5.12907 13.5257 6.96393C16.8667 8.86197 18.5371 9.811 18.8906 11.154C19.0365 11.7084 19.0365 12.2916 18.8906 12.846Z"
                      fill="black"
                    />
                  </g>
                </svg>
              </div>
              <img
                src="https://i.scdn.co/image/ab67616d00001e025c17c9e62fe51ac4b7124f4e"
                alt="card-image-1"
              />
              <h3>Rahmatun <br />Lil’Alameen</h3>
              <p style="font-size: 15px; color: grey">Maher Zain</p>
            </div>

            <div class="card">
              <div class="playbutton">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 30 30"
                  width="60"
                  height="60"
                >
                  <circle cx="12" cy="12" r="12" fill="#1db954" />
                  <g transform="scale(0.74) translate(4  4)">
                    <path
                      d="M18.8906 12.846C18.5371 14.189 16.8667 15.138 13.5257 17.0361C10.296 18.8709 8.6812 19.7884 7.37983 19.4196C6.8418 19.2671 6.35159 18.9776 5.95624 18.5787C5 17.6139 5 15.7426 5 12C5 8.2574 5 6.3861 5.95624 5.42132C6.35159 5.02245 6.8418 4.73288 7.37983 4.58042C8.6812 4.21165 10.296 5.12907 13.5257 6.96393C16.8667 8.86197 18.5371 9.811 18.8906 11.154C19.0365 11.7084 19.0365 12.2916 18.8906 12.846Z"
                      fill="black"
                    />
                  </g>
                </svg>
              </div>
              <img
                src="https://i.scdn.co/image/ab67616d00001e025c17c9e62fe51ac4b7124f4e"
                alt="card-image-1"
              />
              <h3>Rahmatun <br />Lil’Alameen</h3>
              <p style="font-size: 15px; color: grey">Maher Zain</p>
            </div>
          </div>
        </div>
        <!-- End of spotify-playlists -->

        <!-- Playbar is now properly positioned outside the playlists content block -->
        <div class="playbar">
          <div class="seekbar">
            <div class="circle"></div>
          </div>
          <div class="songinfo"></div>
          <div class="songbuttons">
            <img id="previous" src="previoussong.svg" alt="" />
            <button id="playBtn">
              <img id="playImg" src="play.svg" class="playsvg" alt="" />
            </button>
            <img id="next" src="nextsong.svg" alt="" />
            <span class="songTime">00:00 / 00:00</span>
          </div>
          <div class="songName">Song Name</div>
        </div>
      </div>
      <!-- Closes .right -->
    </div>
    <!-- Closes .container -->

    <script src="script.js"></script>
  </body>
</html>
